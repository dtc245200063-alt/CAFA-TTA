services:
  trainer:
    build:
      context: .
      dockerfile: Dockerfile
    image: cafa-tta-trainer:local
    gpus: all
    working_dir: /runner
    volumes:
      - type: bind
        source: ..
        target: /project
        read_only: true
      - type: bind
        source: ./docker_runs
        target: /outputs
    environment:
      - PYTHONUNBUFFERED=1
    # No background service, restart policy, or automatic training.
    restart: "no"
